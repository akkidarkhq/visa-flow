spring.application.name=VisaApp

# ----------------------------------------
# PostgreSQL Database Configuration
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/visa_app
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# JPA & Hibernate Configuration
# ----------------------------------------
# 'update' automatically updates the schema based on your entities.
# Note: For production, use 'validate' and a migration tool like Flyway.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly set dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable open-in-view to prevent lazy loading warnings and issues
spring.jpa.open-in-view=false

# ----------------------------------------
# Jackson Configuration
# Automatically converts single JSON objects {} into a List [{}]
# ----------------------------------------
spring.jackson.deserialization.accept-single-value-as-array=true

# ----------------------------------------
# Security Configuration
# ----------------------------------------
visaflow.app.jwtSecret:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
visaflow.app.jwtExpirationMs:86400000

# ----------------------------------------
# Swagger / OpenAPI Configuration
# ----------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ----------------------------------------
# DevTools Auto-Reload
# ----------------------------------------
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
spring.devtools.livereload.enabled=true

# ----------------------------------------
# VisaFlow AI Assistant Configuration
# ----------------------------------------
# Provider options: auto, openai, gemini, local
# 'auto' automatically selects OpenAI or Gemini if an API key is present, otherwise falls back to local RAG
visaflow.ai.provider=${VISAFLOW_AI_PROVIDER:auto}

# OpenAI Configuration
visaflow.ai.openai.api-key=${OPENAI_API_KEY:}
visaflow.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
visaflow.ai.openai.base-url=https://api.openai.com/v1

# Google Gemini Configuration
visaflow.ai.gemini.api-key=${GEMINI_API_KEY:}
visaflow.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
visaflow.ai.gemini.base-url=https://generativelanguage.googleapis.com
