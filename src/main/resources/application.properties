spring.application.name=VisaApp

# ----------------------------------------
# PostgreSQL Database Configuration
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/visapp
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# JPA & Hibernate Configuration
# ----------------------------------------
# 'update' automatically updates the schema based on your entities.
# Note: For production, use 'validate' and a migration tool like Flyway.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly set dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable open-in-view to prevent lazy loading warnings and issues
spring.jpa.open-in-view=false
